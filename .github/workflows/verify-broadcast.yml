name: Verify live Isocore Broadcast
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-broadcast.yml'
      - 'public/preview.html'
      - 'public/assets/broadcast.css'
      - 'public/assets/bridge.js'
      - 'public/assets/ig-ghost-world-xsolla.js'
      - 'src/worker.mjs'
      - 'public/control.html'
      - 'migrations/0001_init.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out updated source
        uses: actions/checkout@v4
      - name: Verify Worker and camera JavaScript syntax
        run: |
          node --check src/worker.mjs
          node --check public/assets/bridge.js
          node --check public/assets/ig-ghost-world-xsolla.js
      - name: Probe deployed Worker endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, sys
          base='https://isocore-broadcast.tgvain1.workers.dev'
          problems=[]
          for path in ('/api/health','/api/state','/preview.html','/control.html','/xsolla-setup.html'):
              url=base+path
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Isocore-Broadcast-SmokeTest/1.0'}),timeout=20) as r:
                      body=r.read(4096).decode('utf-8','replace')
                      code=r.status
                      print(path, 'HTTP', code, 'Content-Type:',r.headers.get('Content-Type',''))
                      if path=='/api/health':
                          try:
                              data=json.loads(body)
                              print('HEALTH:',json.dumps(data))
                              if data.get('ok') is not True: problems.append('Health not ready')
                          except Exception:
                              problems.append('Health not JSON')
                      elif path=='/api/state':
                          data=json.loads(body)
                          print('CAMERA:',json.dumps(data.get('camera')))
                          if not data.get('ok'): problems.append('Camera API not ready')
                      elif '<html' not in body.lower() and '<!doctype' not in body.lower():
                          problems.append(path+' did not return HTML')
              except urllib.error.HTTPError as e:
                  print(path, 'HTTP',e.code,'DETAIL',e.read(1024).decode('utf-8','replace'))
                  problems.append(path+' HTTP '+str(e.code))
              except Exception as e:
                  print(path, 'CONNECTION ERROR',repr(e))
                  problems.append(path+' unreachable')
          if problems:
              print('RESULT: NOT READY:', '; '.join(problems))
              sys.exit(1)
          print('RESULT: API and static pages reachable. Browser/WebGL and Xsolla not yet tested.')
          # A fresh live deploy should serve the updated preview interactivity marker.
          import time
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+'/preview.html',headers={'User-Agent':'Isocore-Broadcast-SmokeTest/1.0'}), timeout=20) as page:
                      preview=page.read().decode('utf-8','replace')
                  with urllib.request.urlopen(urllib.request.Request(base+'/assets/broadcast.css',headers={'User-Agent':'Isocore-Broadcast-SmokeTest/1.0'}), timeout=20) as asset:
                      styles=asset.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  print('Live asset HTTP',e.code,'at',e.url,'body',e.read(300).decode('utf-8','replace'))
                  preview=''; styles=''
              with urllib.request.urlopen(urllib.request.Request(base+'/api/state',headers={'User-Agent':'Isocore-Broadcast-SmokeTest/1.0'}), timeout=20) as state_url:
                  current=json.loads(state_url.read().decode('utf-8','replace')).get('camera',{})
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+'/assets/bridge.js',headers={'User-Agent':'Isocore-Broadcast-SmokeTest/1.0'}), timeout=20) as a:
                      bridge=a.read().decode('utf-8','replace')
                  with urllib.request.urlopen(urllib.request.Request(base+'/assets/ig-ghost-world-xsolla.js',headers={'User-Agent':'Isocore-Broadcast-SmokeTest/1.0'}), timeout=20) as a:
                      engine=a.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  print('Engine HTTP',e.code)
                  bridge='';engine=''
              if ('id="iso-preview-toggle"' in preview and
                  'bridge.js?v=10' in preview and
                  'V0.6.4' in styles and
                  "ROOT.classList.add('isocore-camera-booting')" in bridge and
                  'Isocore Broadcast Studio Key' in engine and
                  'renderer.toneMappingExposure = 1.32' in engine and
                  'coverN = names.length;' in engine and
                  (current.get('shot')=='first' or (current.get('shot') in ('side','shoulder','wide','high') and int(current.get('updated_at') or 0)>0))):
                  print('RESULT: V0.6.4 BRIGHTER RIGS / INTRO-FREE CAMERA DEPLOYED')
                  print('ON-AIR STATE:',json.dumps(current))
                  break
              print('Updated preview not deployed yet, attempt',attempt+1)
              time.sleep(8)
          else:
              print('RESULT: V0.6.4 BRIGHTER RIGS / INTRO-FREE CAMERA NOT YET DEPLOYED')
              sys.exit(1)
          # This test checks HTTP availability. The actual arena close button still needs
          # a browser interaction test, which HTTP-only checks cannot simulate.

          PY
