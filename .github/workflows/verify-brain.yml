name: Verify Ghost and Echo Brain
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-brain.yml'
      - 'src/brain.mjs'
      - 'src/chat-bot.mjs'
      - 'src/worker.mjs'
      - 'tests/brain.test.mjs'
      - 'public/brain-console.html'
      - 'public/brain-screen.html'
      - 'wrangler.jsonc'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker scripts and brain tests
        run: |
          node --check src/brain.mjs
          node --check src/worker.mjs
          node --check src/chat-bot.mjs
          node --test tests/brain.test.mjs tests/worker.test.mjs
      - name: Verify private control and public-safe status boundaries
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const worker=fs.readFileSync('src/worker.mjs','utf8');
          const brain=fs.readFileSync('src/brain.mjs','utf8');
          const owner=fs.readFileSync('public/brain-console.html','utf8');
          const screen=fs.readFileSync('public/brain-screen.html','utf8');
          assert.match(worker,/path==='\/api\/brain\/status'/);
          assert.match(worker,/authorized\(request,env.CONTROL_TOKEN\)/);
          assert.match(worker,/path==='\/api\/brain\/public'/);
          assert.match(brain,/status='draft'/);
          assert.match(brain,/world_action_executed:false/);
          assert.doesNotMatch(brain,/DAILY_LIMIT|COOLDOWN|max_calls_per_day/);
          assert.match(owner,/type="password"/);
          assert.match(screen,/api\/brain\/public/);
          assert.doesNotMatch(screen,/CONTROL_TOKEN/);
          console.log('Brain controls, approval boundary, and public screen checks pass.');
          JS

      - name: Verify Cloudflare has published the new brain pages and owner gating
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          base='https://isocore-broadcast.tgvain1.workers.dev'
          def check(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'Isocore-Brain-Deployment-Check','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=14) as r:
                      return r.status,r.read(10000).decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code,e.read(2000).decode('utf-8','replace')
          for attempt in range(6):
              a,html=check('/brain-console.html')
              b,display=check('/brain-screen.html')
              c,public=check('/api/brain/public')
              d,private=check('/api/brain/status')
              try: data=json.loads(public)
              except ValueError: data={}
              ok=(a==200 and 'Ghost &amp; Echo — The Brain' in html and
                  b==200 and 'api/brain/public' in display and
                  c==200 and data.get('ok') is True and
                  d==403 and 'Owner authorization required' in private)
              print('Attempt',attempt+1,'console',a,'screen',b,'public',c,'private',d,'PASSED' if ok else 'NOT DEPLOYED YET')
              if ok: break
              time.sleep(10)
          else:
              raise SystemExit('Cloudflare brain deployment not verified. Code tests passed but check Worker GitHub deployment.')
          PY

