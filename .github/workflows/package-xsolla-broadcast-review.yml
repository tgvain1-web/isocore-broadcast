name: Package Xsolla Broadcast 2026 review files
on:
  push:
    branches:
      - feature/xsolla-broadcast-complete-20261121
    paths:
      - '.github/workflows/package-xsolla-broadcast-review.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xsolla-broadcast-complete-20261121
      - name: Validate JS, read-only APIs and latest model URLs
        run: |
          node --check --input-type=commonjs < public/xsolla-broadcast-2026/03-JAVASCRIPT.txt
          node --test tests/xsolla-broadcast-2026.test.mjs
      - name: Create copy-ready three-tab ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          dst=Path('downloads/ISOCORE-XSOLLA-BROADCAST-2026.zip')
          dst.parent.mkdir(parents=True,exist_ok=True)
          files=['01-HTML.txt','02-CSS.txt','03-JAVASCRIPT.txt','README.md']
          with zipfile.ZipFile(dst,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for name in files:
              z.write(Path('public/xsolla-broadcast-2026')/name,name)
          print('ZIP:',dst, 'bytes:',dst.stat().st_size)
          with zipfile.ZipFile(dst) as z:
            assert set(z.namelist())==set(files)
            for name in files:
              assert z.read(name)==(Path('public/xsolla-broadcast-2026')/name).read_bytes()
          PY
      - name: Save review ZIP to this isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/ISOCORE-XSOLLA-BROADCAST-2026.zip
          git diff --cached --quiet && exit 0
          git commit -m "Bundle copy-ready Xsolla broadcast code tabs"
          git push origin HEAD:feature/xsolla-broadcast-complete-20261121
