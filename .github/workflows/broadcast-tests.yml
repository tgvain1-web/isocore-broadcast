name: Broadcast validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/assets/**'
      - '.github/workflows/broadcast-tests.yml'
  push:
    branches:
      - feature/ghost-echo-follow-counters
jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/social.mjs
          node --check src/worker.mjs
          node --check public/assets/bridge.js
          node --check public/assets/social-overlay.js
          node --check public/assets/ig-ghost-world-xsolla.js
      - name: Unit tests
        run: node --test tests/*.test.mjs
