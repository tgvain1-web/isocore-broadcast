<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Isocore Broadcast — Live arena preview</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body:before{content:"BROADCAST PREVIEW // NOT LIVE ON TWITCH";position:fixed;right:12px;top:8px;background:#0a1320;color:#a5bed2;z-index:20000;padding:6px 12px;font:700 11px Arial}
body{background:#070e1b!important}
.preview-tools{position:fixed;top:12px;left:12px;display:flex;align-items:center;gap:8px;z-index:30000;font:700 12px/1.3 Arial,sans-serif}
.preview-tools button,.preview-tools a{border:1px solid #00d4ff88;border-radius:5px;padding:9px 11px;background:#091d2ded;color:#d7f4ff;cursor:pointer;text-decoration:none}
.preview-tools button:focus-visible,.preview-tools a:focus-visible{outline:2px solid white}
@media(max-width:480px){.preview-tools{top:50px;left:8px;right:8px;justify-content:center}.preview-tools button,.preview-tools a{padding:8px 9px;font-size:11px}}
</style></head><body class="isocore-preview"><div class="preview-tools"><button type="button" id="iso-preview-toggle" aria-pressed="false">Show camera buttons</button><a href="/control.html">Owner controls</a></div><main id="isocore-broadcast" aria-label="Isocore Broadcast 3D Ghost Echo preview"></main><script src="/assets/bridge.js?v=11"></script><script>
(function(){
  var root=document.getElementById('isocore-broadcast');
  var toggle=document.getElementById('iso-preview-toggle');
  var key='isocore_preview_camera_shortcuts';
  var open=false;
  try{open=localStorage.getItem(key)==='1';}catch(e){}
  function render(){
    root.classList.toggle('show-igw-cams',open);
    toggle.textContent=open?'Hide camera buttons':'Show camera buttons';
    toggle.setAttribute('aria-pressed',open?'true':'false');
  }
  toggle.addEventListener('click',function(){
    open=!open;
    try{localStorage.setItem(key,open?'1':'0');}catch(e){}
    render();
  });
  render();
})();
</script></body></html>
