<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ISOCORE // Lightstream Overlay</title>
<link rel="stylesheet" href="/assets/lightstream.css?v=1">
</head>
<body class="isocore-lightstream">
<main id="isocore-broadcast" aria-label="Isocore Broadcast game overlay — transparent 1920 x 1080"></main>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('layout')==='large')document.body.classList.add('isocore-lightstream-large');
  if(q.get('debug')==='1')document.body.classList.add('isocore-lightstream-debug');
  // The default contains only what is required to compose a live 3D camera.
  // ?models=all disables the fast path for troubleshooting.
})();
</script>
<script src="/assets/lightstream-dialogue.js?v=1"></script>
<script src="/assets/bridge.js?v=13"></script>
</body>
</html>
